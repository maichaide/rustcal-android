name: Build for macOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # 允许你手动在 GitHub 网页上点击按钮触发编译
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # 同时支持 Apple Silicon (M1/M2/M3) 和 Intel 芯片的 Mac
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build for Apple Silicon (M系列芯片)
        run: cargo build --target aarch64-apple-darwin --release

      - name: Build for Intel Mac (x86_64)
        run: cargo build --target x86_64-apple-darwin --release

      - name: Archive Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            target/aarch64-apple-darwin/release/rust_cal
            target/x86_64-apple-darwin/release/rust_cal
