[package]
name = "rustcal_android"
version = "0.3.1"
edition = "2021"
description = "RustCal calendar and task manager built with Rust and egui"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rustcal_android"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", features = ["android-native-activity"] }
egui = "0.31.1"
egui_extras = { version = "0.31.1", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
directories = "5.0.1"
anyhow = "1.0.93"
quick-xml = "0.41.0"
encoding_rs = "0.8.35"
chardetng = "0.1.17"
ureq = "2.10"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15.0"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.9", default-features = false, features = ["android-native-activity"] }
android_logger = "0.15.0"
log = "0.4"

[package.metadata.android]
package = "com.rustcal.calendar"
apk_name = "RustCal"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35

[package.metadata.android.application]
label = "RustCal"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
